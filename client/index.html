<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5"
    />
    <title>Link Me — إنجليزي من غير ما تترجم</title>
    <meta
      name="description"
      content="Link Me — إنجليزي من غير ما تترجم. كورسات محادثة وقواعد وآيلتس وإنجليزي أعمال بشرح مصري بسيط، جلسات لايف، وتقدّم محفوظ درس ورا درس."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Link Me — إنجليزي من غير ما تترجم" />
    <meta
      property="og:description"
      content="إنجليزي من غير ما تترجم — كورسات محادثة وقواعد وآيلتس وجلسات لايف مع مدرّس."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/brand-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint so the splash and app match.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#111c2d" : "#ffffff");
        } catch (e) {}
      })();
    </script>
    <style>
      /* ---------- Boot splash: animated Link Me logo ---------- */
      #lm-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #ffffff;
        color: #0a1b33;
        font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }
      html.dark #lm-splash {
        background: #111c2d;
        color: #e8f0ff;
      }
      #lm-splash.lm-done {
        opacity: 0;
        visibility: hidden;
      }
      #lm-splash .lm-splash-mark {
        width: 84px;
        height: 84px;
        animation: lm-pop 0.9s cubic-bezier(0.2, 0.9, 0.2, 1.1) both;
      }
      #lm-splash .lm-letters {
        transform-box: view-box;
        transform-origin: 26px 24px;
        animation: lm-breathe 2.2s ease-in-out infinite;
      }
      #lm-splash .lm-node {
        transform-box: fill-box;
        transform-origin: center;
        animation: lm-node-pulse 2.2s ease-in-out infinite;
      }
      #lm-splash .lm-word {
        display: flex;
        gap: 1px;
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        direction: ltr;
      }
      #lm-splash .lm-word span {
        display: inline-block;
        opacity: 0;
        transform: translateY(10px);
        animation: lm-letter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      #lm-splash .lm-word span:nth-child(1) {
        animation-delay: 0.18s;
      }
      #lm-splash .lm-word span:nth-child(2) {
        animation-delay: 0.26s;
      }
      #lm-splash .lm-word span:nth-child(3) {
        animation-delay: 0.34s;
      }
      #lm-splash .lm-word span:nth-child(4) {
        animation-delay: 0.42s;
      }
      #lm-splash .lm-word span:nth-child(5) {
        animation-delay: 0.5s;
      }
      #lm-splash .lm-word span:nth-child(6) {
        animation-delay: 0.58s;
      }
      #lm-splash .lm-word .lm-accent {
        color: #2563ff;
      }
      html.dark #lm-splash .lm-word .lm-accent {
        color: #8fb4ff;
      }
      #lm-splash .lm-tag {
        font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
        font-size: 12px;
        opacity: 0;
        animation: lm-letter 0.6s ease 0.7s forwards;
        color: #5a6b85;
      }
      html.dark #lm-splash .lm-tag {
        color: #93a6c4;
      }
      #lm-splash .lm-bar {
        width: 132px;
        height: 3px;
        border-radius: 999px;
        background: rgba(37, 99, 255, 0.15);
        overflow: hidden;
      }
      #lm-splash .lm-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #2563ff;
        animation: lm-slide 1.1s ease-in-out infinite;
      }
      html.dark #lm-splash .lm-bar {
        background: rgba(143, 180, 255, 0.18);
      }
      html.dark #lm-splash .lm-bar i {
        background: #8fb4ff;
      }
      @keyframes lm-breathe {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-1.5px) scale(1.03);
        }
      }
      @keyframes lm-node-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.45;
          transform: scale(0.8);
        }
      }
      @keyframes lm-pop {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-12deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }
      @keyframes lm-letter {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes lm-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #lm-splash .lm-letters,
        #lm-splash .lm-node,
        #lm-splash .lm-bar i {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="lm-splash" aria-hidden="true">
      <svg
        class="lm-splash-mark"
        viewBox="0 0 40 40"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="lms-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4d80ff" />
            <stop offset="55%" stop-color="#2f63ff" />
            <stop offset="100%" stop-color="#1a3fc4" />
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11.5" fill="url(#lms-g)" />
        <rect width="40" height="20" rx="11.5" fill="rgba(255,255,255,0.10)" />
        <g class="lm-letters">
          <path
            d="M8.2 15.1c3.6-1.5 7.9-1.3 11.3.9v13.6c-3.4-2.2-7.7-2.4-11.3-.9z"
            fill="#ffffff"
          />
          <path
            d="M31.8 15.1c-3.6-1.5-7.9-1.3-11.3.9v13.6c3.4-2.2 7.7-2.4 11.3-.9z"
            fill="rgba(255,255,255,0.78)"
          />
          <path
            d="M20.3 16.6v13"
            stroke="#1a3fc4"
            stroke-width="1.4"
            stroke-linecap="round"
            opacity="0.55"
          />
          <path
            class="lm-node"
            d="M25.4 14.2h4.6v8.4l-2.3-1.6-2.3 1.6z"
            fill="#ffd84d"
          />
        </g>
      </svg>
      <div class="lm-word" aria-label="Link Me">
        <span>l</span><span>i</span><span>n</span><span>k</span
        ><span class="lm-accent">m</span><span class="lm-accent">e</span
        ><span class="lm-accent">.</span>
      </div>
      <div class="lm-tag">إنجليزي من غير ما تترجم</div>
      <div class="lm-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      // Hide the splash as soon as the app has mounted (with a safety timeout).
      window.__lmHideSplash = function () {
        var el = document.getElementById("lm-splash");
        if (!el) return;
        el.classList.add("lm-done");
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 250);
      };
      setTimeout(function () {
        if (window.__lmHideSplash) window.__lmHideSplash();
      }, 1800);
      // Screen-capture / debugging shortcut: ?nosplash
      if (/[?&]nosplash/.test(location.search)) {
        var s = document.getElementById("lm-splash");
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }
    </script>
    <script src="/api/platform/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
